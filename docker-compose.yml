version: '3.8'

services:
  gemini-proxy:
    build: .
    container_name: gemini_proxy
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${PORT}"
    command: gunicorn --bind 0.0.0.0:${PORT} --workers 4 --timeout 300 app:app
  nginx:
    image: nginx:alpine
    container_name: gemini-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx_conf/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./html:/usr/share/nginx/html:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - gemini-proxy
