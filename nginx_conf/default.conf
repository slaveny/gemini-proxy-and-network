server {
    listen 80;
    listen [::]:80;
    server_name 46.226.160.77;

    # Перенаправляем весь HTTP трафик на безопасный HTTPS по IP
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 46.226.160.77;
    ssl_certificate /etc/nginx/ssl/nginx-selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/nginx-selfsigned.key;

    root /usr/share/nginx/html;

    location = / {
        index index.html;
        try_files /index.html =404;
    }

    location = /chat.js {
        try_files /chat.js =404;
    }

    location /v1beta/{ 
        # Передаем ваш рабочий API-ключ в заголовке, как требует Google
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://gemini_proxy:25200/;
        # Отключение буферизации для потокового вывода ИИ (Streaming)
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding on;
        
        proxy_read_timeout 10m;
        proxy_send_timeout 10m;
        client_max_body_size 50m;
    }
}
